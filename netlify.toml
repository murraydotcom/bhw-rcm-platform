# Netlify configuration — BHW RCM & Billing Command Center

[build]
  publish = "."
  functions = "netlify/functions"

# Scheduled poller: pull new ADT files from the CRISP SFTP drop every 15 min.
# Only runs work when the CRISP_SFTP_* env vars are set (otherwise it no-ops).
[functions."crisp-sftp-poll"]
  schedule = "*/15 * * * *"
