<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — BHW RCM &amp; Billing Command Center</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --base:#243239; --panel:#f7f5f2; --card:#ffffff; --ink:#2f3a3f; --ink-soft:#5b686d;
  --line:#e7e1d9; --blue:#5f8b9d; --blue-d:#4d7686; --denied:#c0503f; --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Montserrat',system-ui,sans-serif;color:var(--ink);
  background:radial-gradient(1200px 600px at 50% -10%, #2d3d45 0%, #243239 55%, #1c272c 100%);
  display:flex;align-items:center;justify-content:center;padding:24px;-webkit-font-smoothing:antialiased}
.wrap{width:100%;max-width:400px}
.brand{display:flex;flex-direction:column;align-items:center;gap:12px;margin-bottom:22px;text-align:center}
.brand img{width:64px;height:64px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.35))}
.brand h1{color:#fff;font-size:18px;font-weight:800;letter-spacing:.3px}
.brand .sub{color:#a9c8d5;font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:1.6px;margin-top:2px}
.card{background:var(--card);border-radius:var(--radius);padding:26px 24px;
  box-shadow:0 10px 40px rgba(0,0,0,.35),0 2px 8px rgba(0,0,0,.2)}
.card h2{font-size:16px;font-weight:700;margin-bottom:3px}
.card p.lede{font-size:12px;color:var(--ink-soft);margin-bottom:18px}
label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-soft);margin:0 0 5px}
input{width:100%;font-family:inherit;font-size:14px;padding:11px 13px;border:1px solid var(--line);
  border-radius:10px;background:#fff;color:var(--ink);margin-bottom:15px}
input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(95,139,157,.18)}
button{width:100%;font-family:inherit;font-size:14px;font-weight:700;border:none;border-radius:10px;
  padding:12px;cursor:pointer;background:var(--blue);color:#fff;transition:filter .15s,transform .05s}
button:hover{filter:brightness(1.06)}button:active{transform:translateY(1px)}
button:disabled{opacity:.6;cursor:default}
.err{display:none;background:#f7e0dc;color:#a53f30;border:1px solid #eec4bc;border-radius:9px;
  padding:9px 12px;font-size:12px;font-weight:600;margin-bottom:14px}
.err.show{display:block}
.foot{text-align:center;color:#8ba4ad;font-size:10.5px;margin-top:18px;line-height:1.6}
.foot a{color:#a9c8d5}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.5);
  border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:7px}
@keyframes sp{to{transform:rotate(360deg)}}
.gbtn{display:none;align-items:center;justify-content:center;gap:10px;width:100%;text-decoration:none;
  font-size:14px;font-weight:600;padding:11px;border:1px solid var(--line);border-radius:10px;
  background:#fff;color:#3c4043;margin-bottom:4px;transition:background .12s}
.gbtn.show{display:flex}
.gbtn:hover{background:#f7f6f4}
.gbtn svg{width:18px;height:18px;flex:0 0 auto}
.divider{display:none;align-items:center;gap:10px;color:var(--ink-soft);font-size:11px;
  font-weight:600;text-transform:uppercase;letter-spacing:.6px;margin:14px 0}
.divider.show{display:flex}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
#form.hide{display:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <img src="provider/assets/bhw-emblem.png" alt="BHW Medical Group">
    <div><h1>RCM &amp; Billing Command Center</h1><div class="sub">BHW Medical Group</div></div>
  </div>
  <div class="card">
    <h2>Sign in</h2>
    <p class="lede">Staff access to the revenue-cycle workspace.</p>
    <div class="err" id="err"></div>
    <a class="gbtn" id="gbtn" href="#">
      <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.9 2.4 30.4 0 24 0 14.6 0 6.4 5.4 2.5 13.3l7.9 6.1C12.3 13.3 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.6c0-1.6-.1-3.1-.4-4.6H24v9.1h12.4c-.5 2.9-2.1 5.3-4.6 7l7.1 5.5c4.2-3.9 6.6-9.6 6.6-16.4z"/><path fill="#FBBC05" d="M10.4 28.6c-.5-1.5-.8-3-.8-4.6s.3-3.1.8-4.6l-7.9-6.1C.9 16.5 0 20.1 0 24s.9 7.5 2.5 10.7l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.4 0 11.9-2.1 15.9-5.8l-7.1-5.5c-2 1.3-4.5 2.1-8.8 2.1-6.3 0-11.7-3.8-13.6-9.4l-7.9 6.1C6.4 42.6 14.6 48 24 48z"/></svg>
      Sign in with Google
    </a>
    <div class="divider" id="divider">or</div>
    <form id="form" autocomplete="on">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" autocomplete="username" required autofocus>
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
      <button type="submit" id="submit">Sign in</button>
    </form>
  </div>
  <div class="foot">Protected workspace — PHI &amp; billing data.<br>
    Trouble signing in? Contact your practice administrator.</div>
</div>
<script>
// Only allow same-origin relative redirect targets (block open-redirects).
function safeNext() {
  const raw = new URLSearchParams(location.search).get("next") || "/index.html";
  if (raw.startsWith("/") && !raw.startsWith("//")) return raw;
  return "/index.html";
}
const NEXT = safeNext();
const err = document.getElementById("err");
function showErr(m) { err.textContent = m; err.classList.add("show"); }

// Surface an error handed back by the Google callback (?error=...).
const ERR_MSG = {
  domain: "Please use your BHW Medical Group Google account.",
  google_denied: "Google sign-in was cancelled.",
  bad_state: "Your sign-in session expired. Please try again.",
  exchange_failed: "Couldn’t complete Google sign-in. Please try again.",
  bad_token: "Couldn’t verify your Google account. Please try again.",
  unverified: "Your Google email address isn’t verified.",
  google_unconfigured: "Google sign-in isn’t configured on the server yet.",
};
const errParam = new URLSearchParams(location.search).get("error");
if (errParam) showErr(ERR_MSG[errParam] || "Sign-in failed. Please try again.");

// Point the Google button at the start endpoint, preserving the next target.
const gbtn = document.getElementById("gbtn");
gbtn.setAttribute("href", "/.netlify/functions/auth-google-start?next=" + encodeURIComponent(NEXT));

// If already signed in (or auth disabled), skip the form.
(async () => {
  try {
    const r = await fetch("/.netlify/functions/auth-me", { credentials: "same-origin" });
    if (r.ok) { const d = await r.json(); if (d.ok) { location.replace(NEXT); return; } }
  } catch (e) { /* offline / functions unavailable — show the form */ }
})();

// Show only the sign-in methods the server has enabled.
(async () => {
  try {
    const r = await fetch("/.netlify/functions/auth-config", { credentials: "same-origin" });
    const d = await r.json().catch(() => ({}));
    const m = (d && d.methods) || {};
    if (m.google) { gbtn.classList.add("show"); }
    if (m.google && m.password) { document.getElementById("divider").classList.add("show"); }
    if (m.password === false) { document.getElementById("form").classList.add("hide"); }
  } catch (e) { /* leave the password form visible as the default */ }
})();

document.getElementById("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  err.classList.remove("show");
  const btn = document.getElementById("submit");
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span>Signing in…';
  try {
    const r = await fetch("/.netlify/functions/auth-login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      credentials: "same-origin",
      body: JSON.stringify({
        email: document.getElementById("email").value.trim(),
        password: document.getElementById("password").value,
      }),
    });
    const d = await r.json().catch(() => ({}));
    if (r.ok && d.ok) { location.replace(NEXT); return; }
    if (r.status === 503) showErr("Sign-in isn’t configured on the server yet.");
    else showErr(d.error === "invalid email or password" ? "Invalid email or password." : (d.error || "Sign-in failed. Try again."));
  } catch (e) {
    showErr("Network error — please try again.");
  }
  btn.disabled = false; btn.textContent = "Sign in";
});
</script>
</body>
</html>
